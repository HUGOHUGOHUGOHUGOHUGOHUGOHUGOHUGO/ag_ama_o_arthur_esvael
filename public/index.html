<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Brotato-like Online</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #14161c; color: #eee;
    font-family: 'Segoe UI', Arial, sans-serif; overflow-x: hidden;
    overscroll-behavior: none;
  }
  * { -webkit-tap-highlight-color: transparent; }
  #wrap { display: flex; flex-direction: column; align-items: center; padding: 16px; box-sizing: border-box; min-height: 100vh; }
  h1 { font-size: 18px; margin: 0 0 16px; color: #ffd75d; letter-spacing: 1px; text-align: center; }

  /* ---- Lobby ---- */
  #lobby {
    background: #1c2029; border: 2px solid #3a3f4f; border-radius: 12px;
    padding: 24px; width: min(320px, 92vw); box-sizing: border-box;
    display: flex; flex-direction: column; gap: 16px;
  }
  #lobby label { font-size: 12px; color: #999; display: block; margin-bottom: 4px; }
  #lobby input {
    width: 100%; box-sizing: border-box; padding: 12px; border-radius: 6px;
    border: 1px solid #3a3f4f; background: #14161c; color: #eee; font-size: 16px;
  }
  #roomInput { text-transform: uppercase; letter-spacing: 3px; text-align: center; font-weight: bold; }
  .lobby-section { border-top: 1px solid #2a2f3d; padding-top: 16px; }
  .lobby-section:first-of-type { border-top: none; padding-top: 0; }
  button {
    cursor: pointer; border: none; border-radius: 6px; padding: 13px;
    font-size: 15px; font-weight: bold; width: 100%; touch-action: manipulation;
  }
  #createBtn { background: #ffd75d; color: #14161c; }
  #joinBtn { background: #5dd8ff; color: #14161c; margin-top: 8px; }
  #lobbyMsg { font-size: 12px; color: #ff8d8d; min-height: 16px; }
  #lobbyStatus { font-size: 11px; color: #666; }

  /* ---- Game ---- */
  #gameScreen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 900px; }
  #hud { display: flex; gap: 14px; margin-bottom: 8px; font-size: 12px; flex-wrap: wrap; justify-content: center; }
  #hud span { color: #ffd75d; font-weight: bold; }
  #roomBadge {
    background: #2a2f3d; padding: 4px 10px; border-radius: 6px; font-size: 11px;
    letter-spacing: 2px; color: #5dd8ff; font-weight: bold;
  }
  .canvas-wrap { position: relative; width: 100%; max-width: 900px; }
  canvas {
    background: #202430; border: 2px solid #3a3f4f; border-radius: 8px;
    width: 100%; height: auto; display: block; touch-action: none;
  }
  #status { margin-top: 8px; font-size: 12px; color: #888; }
  #help { margin-top: 6px; font-size: 11px; color: #666; text-align: center; }

  /* ---- Joystick virtual (só aparece em telas de toque) ---- */
  #joystick {
    display: none; position: absolute; left: 24px; bottom: 24px;
    width: 110px; height: 110px; border-radius: 50%;
    background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.18);
    touch-action: none;
  }
  #joystickKnob {
    position: absolute; left: 50%; top: 50%; width: 46px; height: 46px;
    margin-left: -23px; margin-top: -23px; border-radius: 50%;
    background: rgba(255,215,93,0.85); border: 2px solid #ffd75d;
  }
  @media (pointer: coarse) {
    #joystick { display: block; }
  }

  /* ---- Loja entre rodadas ---- */
  #shopOverlay {
    display: none; position: absolute; inset: 0; background: rgba(10,11,15,0.92);
    border-radius: 8px; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box; text-align: center; z-index: 5;
  }
  #shopOverlay.active { display: flex; }
  #shopOverlay h2 { color: #ffd75d; font-size: 16px; margin: 0 0 4px; letter-spacing: 1px; }
  #shopOverlay .shopSub { color: #8992a4; font-size: 12px; margin-bottom: 18px; }
  #shopOptions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 640px; }
  .shopCard {
    background: #1c2029; border: 2px solid #3a3f4f; border-radius: 10px;
    padding: 16px; width: 160px; cursor: pointer; touch-action: manipulation;
  }
  .shopCard:hover, .shopCard:active { border-color: #ffd75d; }
  .shopCard .label { color: #ffd75d; font-weight: bold; font-size: 13px; margin-bottom: 6px; }
  .shopCard .desc { color: #8992a4; font-size: 11px; }
  #shopWaiting { color: #5dd8ff; font-size: 13px; margin-top: 16px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>🥔 BROTATO-LIKE — MULTIPLAYER ONLINE</h1>

  <div id="lobby">
    <div class="lobby-section">
      <label for="nameInput">Seu nome (opcional)</label>
      <input id="nameInput" maxlength="16" placeholder="Ex: Zé">
    </div>
    <div class="lobby-section">
      <button id="createBtn">Criar sala nova</button>
    </div>
    <div class="lobby-section">
      <label for="roomInput">Ou entre com o código de uma sala</label>
      <input id="roomInput" maxlength="4" placeholder="XXXX">
      <button id="joinBtn">Entrar na sala</button>
    </div>
    <div id="lobbyMsg"></div>
    <div id="lobbyStatus">Conectando ao servidor...</div>
  </div>

  <div id="gameScreen">
    <div id="hud">
      <div id="roomBadge">SALA: <span id="roomCode">----</span></div>
      <div>Onda: <span id="wave">0</span></div>
      <div>Próxima onda em: <span id="waveTimer">--</span>s</div>
      <div>Jogadores: <span id="playerCount">0</span></div>
    </div>
    <div class="canvas-wrap">
      <canvas id="game" width="900" height="600"></canvas>
      <div id="joystick"><div id="joystickKnob"></div></div>
      <div id="shopOverlay">
        <h2>LOJA — ESCOLHA UM UPGRADE</h2>
        <div class="shopSub">Próxima onda em <span id="shopTimer">--</span>s</div>
        <div id="shopOptions"></div>
        <div id="shopWaiting"></div>
      </div>
    </div>
    <div id="status"></div>
    <div id="help">PC: WASD/setas move · Celular: use o manche na tela · Ataque automático</div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
