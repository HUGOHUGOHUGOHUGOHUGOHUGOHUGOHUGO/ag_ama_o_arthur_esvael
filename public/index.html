<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Brotato-like Online</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #14161c; color: #eee;
    font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden;
  }
  #wrap { display: flex; flex-direction: column; align-items: center; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 20px; color: #ffd75d; letter-spacing: 1px; }

  /* ---- Lobby ---- */
  #lobby {
    background: #1c2029; border: 2px solid #3a3f4f; border-radius: 12px;
    padding: 28px 32px; width: 320px; display: flex; flex-direction: column; gap: 16px;
  }
  #lobby label { font-size: 12px; color: #999; display: block; margin-bottom: 4px; }
  #lobby input {
    width: 100%; box-sizing: border-box; padding: 10px; border-radius: 6px;
    border: 1px solid #3a3f4f; background: #14161c; color: #eee; font-size: 14px;
  }
  #roomInput { text-transform: uppercase; letter-spacing: 3px; text-align: center; font-weight: bold; }
  .lobby-section { border-top: 1px solid #2a2f3d; padding-top: 16px; }
  .lobby-section:first-of-type { border-top: none; padding-top: 0; }
  button {
    cursor: pointer; border: none; border-radius: 6px; padding: 11px;
    font-size: 14px; font-weight: bold; width: 100%;
  }
  #createBtn { background: #ffd75d; color: #14161c; }
  #createBtn:hover { background: #ffe08a; }
  #joinBtn { background: #5dd8ff; color: #14161c; margin-top: 8px; }
  #joinBtn:hover { background: #8ae5ff; }
  #lobbyMsg { font-size: 12px; color: #ff8d8d; min-height: 16px; }
  #lobbyStatus { font-size: 11px; color: #666; }

  /* ---- Game ---- */
  #gameScreen { display: none; flex-direction: column; align-items: center; }
  #hud { display: flex; gap: 20px; margin-bottom: 8px; font-size: 13px; flex-wrap: wrap; justify-content: center; }
  #hud span { color: #ffd75d; font-weight: bold; }
  #roomBadge {
    background: #2a2f3d; padding: 4px 10px; border-radius: 6px; font-size: 12px;
    letter-spacing: 2px; color: #5dd8ff; font-weight: bold;
  }
  canvas { background: #202430; border: 2px solid #3a3f4f; border-radius: 8px; }
  #status { margin-top: 8px; font-size: 12px; color: #888; }
  #help { margin-top: 6px; font-size: 12px; color: #666; }
</style>
</head>
<body>
<div id="wrap">
  <h1>🥔 BROTATO-LIKE — MULTIPLAYER ONLINE</h1>

  <div id="lobby">
    <div class="lobby-section">
      <label for="nameInput">Seu nome (opcional)</label>
      <input id="nameInput" maxlength="16" placeholder="Ex: Zé">
    </div>

    <div class="lobby-section">
      <button id="createBtn">Criar sala nova</button>
    </div>

    <div class="lobby-section">
      <label for="roomInput">Ou entre com o código de uma sala</label>
      <input id="roomInput" maxlength="4" placeholder="XXXX">
      <button id="joinBtn">Entrar na sala</button>
    </div>

    <div id="lobbyMsg"></div>
    <div id="lobbyStatus">Conectando ao servidor...</div>
  </div>

  <div id="gameScreen">
    <div id="hud">
      <div id="roomBadge">SALA: <span id="roomCode">----</span></div>
      <div>Onda: <span id="wave">0</span></div>
      <div>Próxima onda em: <span id="waveTimer">--</span>s</div>
      <div>Jogadores: <span id="playerCount">0</span></div>
    </div>
    <canvas id="game" width="900" height="600"></canvas>
    <div id="status"></div>
    <div id="help">Mover: WASD ou setas · Ataque automático (pistola + espada) · Compartilhe o código da sala com seus amigos</div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
